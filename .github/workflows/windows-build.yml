name: windows-build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:              # a newer push replaces a running build: an older build can never publish last
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # publish the GitHub Release used by the in-app online update

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Build number (version 0.2.<run number>)
        shell: pwsh
        env:
          PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          "BUILD = ${{ github.run_number }}" | Out-File -Encoding ascii level7/_build.py
          if ($env:PUBLIC_URL) {
            $u = $env:PUBLIC_URL.TrimEnd('/')
            "UPDATE_URL = `"$u/latest.json`"" | Out-File -Append -Encoding ascii level7/_build.py
          }
          Get-Content level7/_build.py

      - uses: dtolnay/rust-toolchain@stable

      - name: Build sparrow nesting engine (MIT; pinned commit)
        shell: pwsh
        env:
          SPARROW_COMMIT: 4629b22795ae6b25b3b460ccde6fb36a71292b6d
        run: |
          git clone --quiet https://github.com/JeroenGar/sparrow.git ..\sparrow-src
          if ($LASTEXITCODE -ne 0) { throw "sparrow clone failed" }
          git -C ..\sparrow-src checkout --quiet $env:SPARROW_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "pinned sparrow commit not available" }
          Copy-Item packaging\sparrow\Cargo.lock ..\sparrow-src\Cargo.lock   # dependency versions as tested
          cargo build --release --locked --manifest-path ..\sparrow-src\Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "sparrow build failed" }
          New-Item -ItemType Directory -Force engines | Out-Null
          Copy-Item ..\sparrow-src\target\release\sparrow.exe engines\
          & engines\sparrow.exe --help | Select-Object -First 3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .

      - name: Unit tests (Windows)
        run: python -m pytest -q --junitxml=test-results.xml

      - name: GUI smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir ui-shots
          python tests/ui_smoke.py ui-shots

      - name: Third-party licence texts (bundled as _internal/licenses)
        shell: pwsh
        run: |
          python tools/collect_licenses.py -o build-licenses
          if ($LASTEXITCODE -ne 0) { throw "licence collection failed" }
          New-Item -ItemType Directory -Force build-licenses/qt | Out-Null
          Invoke-WebRequest https://www.gnu.org/licenses/lgpl-3.0.txt -OutFile build-licenses/qt/LGPL-3.0.txt
          Invoke-WebRequest https://www.gnu.org/licenses/gpl-3.0.txt -OutFile build-licenses/qt/GPL-3.0.txt

      - name: PyInstaller build
        run: pyinstaller packaging/level7.spec --noconfirm --clean

      - name: Frozen executable smoke test
        shell: pwsh
        run: |
          $exe = "dist\LEVEL7Nesting\level7-cli.exe"
          & $exe inspect "samples\Neay blue pants.mdl" "samples\Neay blue pants-44.scb" -o frozen-reports
          if ($LASTEXITCODE -ne 0) { throw "inspect failed" }
          & $exe nest "samples\Neay blue pants-44.scb" --width 1430 --time 10 -o frozen.l7n
          if ($LASTEXITCODE -ne 0) { throw "nest failed / invalid marker" }
          & $exe nest "samples\Neay blue pants-44.scb" --width 1500 --time 25 --engine auto -o frozen_sparrow.l7n | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { throw "nest with sparrow failed / invalid marker" }
          if (-not ($out -match "engine: sparrow|engine: builtin")) { throw "engine not reported" }
          $sp = "dist\LEVEL7Nesting\_internal\engines\sparrow.exe"
          if (!(Test-Path $sp)) { throw "sparrow engine is not bundled" }
          & $sp --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "bundled sparrow engine does not start" }
          & $exe export frozen.l7n --format dxf -o frozen.dxf
          & $exe export frozen.l7n --format plt -o frozen.plt
          if (!(Test-Path frozen.dxf) -or !(Test-Path frozen.plt)) { throw "export failed" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:LEVEL7_NO_UPDATE_CHECK = "1"
          $p = Start-Process "dist\LEVEL7Nesting\LEVEL7Nesting.exe" -ArgumentList '"samples\Neay blue pants-44.scb"' -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "GUI exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $ver = python -c "import level7; print(level7.__version__)"
          & $iscc "/DAppVersion=$ver" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }

      - name: Silent install test (desktop shortcut + launch)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\installer\*-Setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/ALLUSERS','/TASKS="desktopicon"','/LOG=install.log' -Wait
          $app = "${env:ProgramFiles}\LEVEL7 Nesting\LEVEL7Nesting.exe"
          if (!(Test-Path $app)) { Get-Content install.log; throw "not installed" }
          $lnk = "${env:PUBLIC}\Desktop\LEVEL7 Nesting.lnk"
          if (!(Test-Path $lnk)) { throw "desktop shortcut missing" }
          & "${env:ProgramFiles}\LEVEL7 Nesting\level7-cli.exe" info "samples\Neay blue pants-44.scb"
          if ($LASTEXITCODE -ne 0) { throw "installed CLI failed" }
          Write-Host "installed OK: $app, shortcut $lnk"

      - uses: actions/upload-artifact@v4
        with:
          name: LEVEL7Nesting-Setup
          path: dist/installer/*.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            test-results.xml
            ui-shots/
            frozen-reports/
            frozen.dxf
            frozen.plt
            install.log

      - name: Publish release (in-app online update)
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = python -c "import level7; print(level7.__version__)"
          $setup = Get-ChildItem dist\installer\*-Setup.exe | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File -Encoding ascii SHA256SUMS.txt
          git log -1 --pretty=%B | Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session):' } | Out-File -Encoding utf8 notes.txt
          gh release view "v$ver" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {         # re-run of a failed job: the release exists, refresh its files
            gh release upload "v$ver" $setup.FullName SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create "v$ver" $setup.FullName SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY `
              --title "LEVEL7 Nesting $ver" --notes-file notes.txt --target $env:GITHUB_SHA --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "release failed" }

      - name: Publish to own download host (Cloudflare R2)
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && vars.R2_BUCKET != ''
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          $setup = Get-ChildItem dist\installer\*-Setup.exe | Select-Object -First 1
          python tools/make_download_site.py $setup.FullName $env:PUBLIC_URL site --notes notes.txt
          if ($LASTEXITCODE -ne 0) { throw "site generation failed" }
          function Put($file, $key, $type, $cache) {
            aws s3 cp $file "s3://$env:R2_BUCKET/$key" --endpoint-url $env:R2_ENDPOINT --content-type $type --cache-control $cache --only-show-errors
            if ($LASTEXITCODE -ne 0) { throw "upload of $key failed" }
          }
          # installer first, manifest last: the manifest never points to a file that is not there yet
          Put $setup.FullName $setup.Name "application/octet-stream" "public, max-age=31536000, immutable"
          Put $setup.FullName "LEVEL7Nesting-Setup.exe" "application/octet-stream" "no-cache"
          Put "site\index.html" "index.html" "text/html; charset=utf-8" "no-cache"
          Put "site\latest.json" "latest.json" "application/json; charset=utf-8" "no-cache"
          $u = $env:PUBLIC_URL.TrimEnd('/')
          try {
            $m = Invoke-RestMethod "$u/latest.json" -Headers @{ "Cache-Control" = "no-cache" }
            Write-Host "published $($m.version) -> $u/index.html"
          } catch { Write-Warning "uploaded, but $u/latest.json is not readable yet: $_"; $m = $null }
          $ver = python -c "import level7; print(level7.__version__)"
          if ($m -and $m.version -ne $ver) { throw "latest.json shows $($m.version), expected $ver" }
